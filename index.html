<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Delexo</title>
  <meta name="description" content="Just a simple portfolio." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://delexo.store/" />
  <meta property="og:title" content="Delexo" />
  <meta property="og:description" content="Just a simple portfolio." />
  <meta property="og:image" content="https://delexo.store/assets/D.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Delexo" />
  <meta name="twitter:description" content="Just a simple portfolio." />
  <link rel="icon" href="assets/D.png?v=3" type="image/png" />
  <link rel="apple-touch-icon" href="assets/D.png?v=3" />
  <link rel="preload" as="image" href="assets/mochi.webp" fetchpriority="high" />
  <link rel="stylesheet" href="css/base.css?v=68" />
  <link rel="stylesheet" href="css/components.css?v=89" />
  <link rel="stylesheet" href="css/deck.css?v=90" />
  <link rel="stylesheet" href="css/responsive.css?v=101" />
  <link rel="stylesheet" href="css/discord.css?v=63" />
  <link rel="stylesheet" href="css/motion.css?v=63" />
</head>
<body data-view="home">
  <div class="visit-tip" id="visit-tip" data-corner="tl" hidden></div>
  <div class="cursor" id="cursor" aria-hidden="true">
    <svg viewBox="0 0 32 32" width="32" height="32">
      <path fill="#141414" stroke="#141414" stroke-width="2.8" stroke-linejoin="round" d="M5 4.2 22.8 15.4 12.2 18.2 6.4 26.4Z"/>
    </svg>
  </div>
  <div class="lang" id="lang"></div>

  <main class="stage" id="stage" data-view="home">
    <section class="col-left">
      <div class="identity">
        <h1 id="title">Delexo</h1>
        <p class="role" id="role">Computer Science</p>
        <div class="note" id="note" hidden></div>
        <div class="actions" id="actions"></div>
        <div class="social-row" id="social-row" hidden></div>
      </div>
      <div class="lower" id="lower"></div>
      <section class="more" id="more" hidden></section>
    </section>
    <section class="col-right">
      <div class="panel" id="panel"></div>
      <figure class="portrait" id="portrait">
        <img src="assets/discord/avatar.webp" alt="Delexo" width="512" height="512" decoding="async" fetchpriority="low" />
      </figure>
      <div class="dots" id="dots"></div>
    </section>
  </main>

  <div class="discord-modal" id="discord-modal" hidden>
    <button class="discord-modal__backdrop" type="button" data-discord-close tabindex="-1" aria-label="Close"></button>
    <div class="discord-modal__panel" role="dialog" aria-modal="true" aria-labelledby="discord-title">
      <button class="discord-modal__close" type="button" id="discord-close" data-discord-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <article class="discord-profile">
        <div class="discord-profile__banner" aria-hidden="true"></div>
        <div class="discord-profile__body">
          <div class="discord-profile__avatar-wrap">
            <img class="discord-profile__avatar" src="assets/discord/avatar.webp" alt="" width="80" height="80" decoding="async" />
            <span class="discord-profile__status discord-profile__status--dnd" title="Do Not Disturb"></span>
          </div>
          <h2 class="discord-profile__display" id="discord-title">delexo</h2>
          <div class="discord-profile__row">
            <span class="discord-profile__username">delexxo</span>
            <span class="discord-profile__dot" aria-hidden="true">·</span>
            <ul class="discord-profile__badges" aria-label="Discord badges">
              <li><img src="assets/discord/badge-hypesquad-bravery.webp" alt="HypeSquad Bravery" title="HypeSquad Bravery" width="22" height="22" /></li>
              <li><img src="assets/discord/badge-legacy-username.webp" alt="Originally known as…" title="Originally known as…" width="22" height="22" /></li>
              <li><img src="assets/discord/badge-orbs-apprentice.webp" alt="Orbs, Apprentice" title="Orbs, Apprentice" width="22" height="22" /></li>
              <li><img src="assets/discord/badge-quest-completed.webp" alt="Completed a Quest" title="Completed a Quest" width="22" height="22" /></li>
              <li><img src="assets/discord/badge-gifting-luminary.webp" alt="Gifting Luminary" title="Gifting Luminary" width="22" height="22" /></li>
              <li>
                <span class="discord-profile__ai" title="AI">
                  <svg class="discord-profile__ai-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <path fill="#57F287" d="M8 1.2l1.1 3.2L12.4 5.5 9.1 7.2 8 10.4 6.9 7.2 3.6 5.5l3.3-1.1z"/>
                    <path fill="#ED4245" d="M12.2 8.6l.7 2.1 2.1.7-2.1.7-.7 2.1-.7-2.1-2.1-.7 2.1-.7z"/>
                    <path fill="#FEE75C" d="M3.8 9.2l.55 1.65 1.65.55-1.65.55L3.8 13.6l-.55-1.65L1.6 11.4l1.65-.55z"/>
                    <path fill="#EB459E" d="M11.2 2.4l.4 1.2 1.2.4-1.2.4-.4 1.2-.4-1.2-1.2-.4 1.2-.4z"/>
                  </svg>
                  AI
                </span>
              </li>
            </ul>
          </div>
          <div class="discord-request">
            <p class="discord-request__text" id="discord-request"></p>
            <div class="discord-request__actions">
              <button class="discord-request__btn discord-request__btn--accept" type="button" id="discord-accept"></button>
              <button class="discord-request__btn discord-request__btn--ignore" type="button" id="discord-ignore" data-discord-close></button>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>

  <script src="js/copy.js?v=80"></script>
  <script src="js/data.js?v=83"></script>
  <script src="js/core.js?v=71"></script>
  <script src="js/ui.js?v=93"></script>
  <script src="js/deck.js?v=70"></script>
  <script src="js/motion.js?v=124"></script>
  <script src="js/navigation.js?v=103"></script>
  <script src="js/events.js?v=67"></script>
  <script src="js/main.js?v=66"></script>
</body>
</html>
